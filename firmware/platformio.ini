; Solar Orb Clock firmware.
; Build & flash (XIAO ESP32-C6): pio run -e xiao_esp32c6 -t upload   (from firmware/)
; Build & flash (Adafruit QT Py S3, 2MB PSRAM): pio run -e qtpy_esp32s3_psram -t upload
; First bench milestone: compile, flash, then verify /api/status against
; the simulator for the same instant.

[env:xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; Adafruit QT Py ESP32-S3 with 2MB PSRAM (product 5700, "FH4R2" variant).
; Pin map in main.cpp comments; SCL/SDA pads stay free for STEMMA QT I2C.
[env:qtpy_esp32s3_psram]
platform = espressif32
board = adafruit_qtpy_esp32s3_n4r2
framework = arduino
monitor_speed = 115200
build_flags =
    -D ORB_PIN=18
    -D SUN_RING_PIN=17
    -D MOON_RING_PIN=9
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

[platformio]
src_dir = src
