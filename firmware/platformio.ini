; Solar Orb Clock firmware — Seeed XIAO ESP32-C6 target.
; Build & flash: pio run -e xiao_esp32c6 -t upload   (from firmware/)
; First bench milestone: compile, flash, then verify /api/status against
; the simulator for the same instant.

[env:xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

[platformio]
src_dir = src
